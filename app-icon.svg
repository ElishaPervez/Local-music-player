<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d2030"/>
      <stop offset="0.55" stop-color="#12141c"/>
      <stop offset="1" stop-color="#0c0d11"/>
    </linearGradient>
    <linearGradient id="note" x1="320" y1="780" x2="760" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#a98bff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- rounded-square base -->
  <rect width="1024" height="1024" rx="226" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="226" fill="url(#glow)"/>
  <rect x="6" y="6" width="1012" height="1012" rx="220" stroke="white" stroke-opacity="0.07" stroke-width="12" fill="none"/>

  <!-- beamed double note -->
  <g>
    <!-- stems -->
    <path d="M447 663 V330" stroke="url(#note)" stroke-width="58" stroke-linecap="round"/>
    <path d="M723 625 V292" stroke="url(#note)" stroke-width="58" stroke-linecap="round"/>
    <!-- beam -->
    <path d="M447 330 L723 292" stroke="url(#note)" stroke-width="104" stroke-linecap="round"/>
    <!-- note heads -->
    <ellipse cx="372" cy="680" rx="104" ry="82" transform="rotate(-21 372 680)" fill="url(#note)"/>
    <ellipse cx="648" cy="642" rx="104" ry="82" transform="rotate(-21 648 642)" fill="url(#note)"/>
  </g>

  <!-- floating accent dots -->
  <circle cx="816" cy="446" r="26" fill="#a98bff" fill-opacity="0.55"/>
  <circle cx="236" cy="416" r="20" fill="#a98bff" fill-opacity="0.35"/>
</svg>
