name: Release

# Builds the Windows installer (NSIS -setup.exe) and attaches it to a GitHub
# Release. Triggered by pushing a version tag:
#   git tag v0.1.0 && git push origin v0.1.0
# A manual run (workflow_dispatch) builds the installer and uploads it as a
# workflow artifact without creating a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # Release builds don't bundle ffmpeg — the app downloads it on first
      # run — so skip the ~90 MB fetch in scripts/setup-tools.ps1.
      LMP_SKIP_FFMPEG: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # Runs beforeBuildCommand (npm run setup && npm run build) first, which
      # downloads the yt-dlp sidecar that gets bundled into the installer.
      - name: Build installer
        run: npm run tauri build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
